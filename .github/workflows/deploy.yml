name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and build production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend — install & test
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test

      - name: Frontend — install & build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Build deployable Docker image
        run: docker build --tag tradingapp:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Trigger the tested commit deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "Missing repository secret: RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi

          separator='?'
          [[ "$DEPLOY_HOOK_URL" == *'?'* ]] && separator='&'
          curl --fail --silent --show-error --request POST \
            "${DEPLOY_HOOK_URL}${separator}ref=${COMMIT_SHA}"

